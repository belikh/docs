# Publishes https://docs.jupiter.au (GitHub Pages) from this repository, the projects it imports and the latest belikh/design release.
# Runs on a push, every day, by hand, and on a repository_dispatch event: design-released from the design repository,
# docs-changed from any project. A new release of the design system or of a project changes the site without a commit here.
name: docs-site
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [design-released, docs-changed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/update-design.mjs --require-fonts   # the SGI and JetBrains Mono web fonts must be in the release
      - name: Install TeX Live   # one PDF per project; the class loads our fonts from the design bundle, so no font packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended poppler-utils librsvg2-bin
      - name: Validate the source and build the PDFs (one per project), check their fonts
        id: pdf
        continue-on-error: true   # a character the fonts cannot draw stops one PDF; the site is still published
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the import lists the owner's repositories through the API (discover)
        run: |
          npm run check
          npm run build:pdf
      - name: Keep the last published PDF of a project whose PDF did not build
        if: steps.pdf.outcome == 'failure'
        run: |
          echo "::error::A PDF did not build. Its project keeps the PDF that is live now until the error is fixed."
          node scripts/fetch-previous-pdfs.mjs
      - name: Build the site, with a cover preview of the hub PDF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm run build:site
          if [ -f dist/jupiter-docs.pdf ]; then pdftoppm -r 70 -f 1 -l 1 -png -singlefile dist/jupiter-docs.pdf dist/site/jupiter-docs; fi
      - name: Fail if the SGI fonts were not bundled
        run: ls dist/site/assets/fonts | grep -qi "sgi-text"
      - run: touch dist/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
