name: ci
# Tests the generator, validates the source against the latest belikh/design release and builds the site and the PDF.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update:design   # the latest belikh/design release into vendor/design (not committed)
      - run: npm run lint            # skill/SKILL.md matches the generator
      - run: npm test
      - name: Import the projects, validate, check docs/*.md is current and build the site
        env:
          GITHUB_TOKEN: ${{ github.token }}   # the import lists the owner's repositories through the API (discover)
        run: |
          npm run check
          npm run build:site
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run update:design
      - name: Install TeX Live   # the class loads our SGI and JetBrains Mono files from the design bundle; no font packages are needed
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-pictures texlive-fonts-recommended poppler-utils librsvg2-bin
      - name: Build the PDF (fails on a missing glyph) and check its fonts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build:pdf   # scripts/check-pdf-fonts.mjs: only SGI Text, SGI Alt and JetBrains Mono may be embedded
      - run: pdftoppm -r 70 -f 1 -l 1 -png -singlefile dist/jupiter-docs.pdf dist/jupiter-docs
      - uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: |
            dist/jupiter-docs.pdf
            dist/jupiter-docs.png
